{% include base_path %}
{% assign author = site.author %}

<div class="author" itemscope itemtype="https://schema.org/Person">

  <div class="author__avatar">
    <img src="{{ base_path }}/images/{{ author.avatar }}" alt="{{ author.name }}" itemprop="image" fetchpriority="high" width="230" height="300">
  </div>

  <div class="author__content">
    <h3 class="author__name" itemprop="name">{{ author.name }}</h3>
    <p class="author__description">{{ author.description }}</p>
  </div>

  <div class="author__links">
    {% if author.email %}
      <a href="mailto:{{ author.email }}" title="Email"><i class="fas fa-envelope author__icon author__icon--email"></i></a>
    {% endif %}
    {% if author.googlescholar %}
      <a href="https://scholar.google.com/citations?user={{ author.googlescholar }}" target="_blank" rel="noopener" title="Google Scholar"><i class="fas fa-graduation-cap author__icon author__icon--scholar"></i></a>
    {% endif %}
    {% if author.github %}
      <a href="https://github.com/{{ author.github }}" target="_blank" rel="noopener" title="GitHub"><i class="fab fa-github author__icon author__icon--github"></i></a>
    {% endif %}
    {% if author.linkedin %}
      <a href="https://www.linkedin.com/in/{{ author.linkedin }}" target="_blank" rel="noopener" title="LinkedIn"><i class="fab fa-linkedin author__icon author__icon--linkedin"></i></a>
    {% endif %}
    {% if author.orcid %}
      <a href="https://orcid.org/{{ author.orcid }}" target="_blank" rel="noopener" title="ORCID"><i class="fab fa-orcid author__icon author__icon--orcid"></i></a>
    {% endif %}
  </div>

  <div class="author__cv">
    <a href="{{ base_path }}/files/cv.pdf" target="_blank" class="cv-button">
      <i class="fas fa-file-pdf"></i> Download CV
    </a>
  </div>

</div>
