<footer class="site-footer">
  <div class="site-footer__inner">
    <div class="site-footer__left">
      &copy; {{ site.time | date: "%Y" }} <strong>{{ site.author.name }}</strong><br>
      <span class="site-footer__meta">Last Updated: {{ site.time | date: "%B %d, %Y" }}</span>
    </div>

    <div class="site-footer__right">
      <a href="https://github.com/{{ site.repository }}" target="_blank" rel="noopener" class="site-footer__source">
        Source <i class="fas fa-paper-plane"></i>
      </a>
    </div>
  </div>
</footer>

<button id="scroll-to-top" class="scroll-to-top" type="button" title="Go to top" aria-label="Go to top">
  <i class="fas fa-chevron-up"></i>
</button>
