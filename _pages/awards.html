---
title: "Awards & Honors"
permalink: /awards/
---

<div class="timeline-container">
  {% for a in site.data.cv.awards %}
  <div class="timeline-item">
    <div class="timeline-date">{{ a.year }}</div>
    <div class="timeline-content">
      <strong>{{ a.title }}</strong> — {{ a.region }}<br>
      <span class="timeline-meta">{{ a.note }}</span>
    </div>
  </div>
  {% endfor %}
</div>
