research:
  - date: "Jun 2026 – Present"
    role: "Undergraduate Researcher"
    org: "ARC Lab, Seoul National University"
    meta: "Advisor: Prof. Jae W. Lee"
    bullets:
      - "Co-designed Lachesis, a lifetime-aware KV cache placement scheme for agent serving on heterogeneous HBM + High-Bandwidth Flash memory, extending projected flash lifetime by up to 4× over a naive LRU baseline (second author, under review)."
      - "Extended an open-source LLM-serving simulator with two-tier HBM/HBF timing, flash-wear accounting and KV placement policies; led implementation of the memory allocation scheme."
      - "Proposed the threshold-based allocation policy adopted in the final design, after finding in preliminary runs that greedily filling HBM left no room for future shorter-lived KV cache."
      - "Leading the acceleration of GPU kernels used in broad-phase collision detection for robotics simulation, speeding up bounding volume hierarchy tree builds and traversal by 5×."

  - date: "Jan 2026 – Present"
    role: "Undergraduate Researcher"
    org: "Litz Lab, UC Santa Cruz"
    meta: "Advisor: Prof. Heiner Litz · in person Jan – Jun 2026, remote since"
    bullets:
      - "Probed row-buffer timing covert channels and disturbance side channels on a novel STTRAM module."
      - "Built characterization infrastructure on an XUP-P3R FPGA, including a configurable traffic generator with latency-histogram and bandwidth counters, and user-space access via XDMA (MMIO/DMA)."
      - "Found and fixed bugs in the vendor-provided memory-controller patch, including an ECC correction path that overwrote corrected data with another cache line’s contents."

  - date: "Jul 2025 – Dec 2025"
    role: "Undergraduate Researcher"
    org: "VIA Group, KAIST"
    meta: "Advisor: Prof. Minsoo Rhu"
    bullets:
      - "Reproduced SCNN (ISCA ’17), a sparse CNN accelerator, as a cycle-level C++ simulator and evaluated its speedup over dense computation."
      - "Reimplemented vDNN (MICRO ’16) in C++ and CUDA: a runtime memory manager that overlaps GPU-to-CPU offloading and prefetching with computation to reduce GPU memory usage during DNN training."

  - date: "Feb 2025 – Jul 2025"
    role: "Undergraduate Researcher"
    org: "RIRO Lab, KAIST"
    meta: "Advisor: Prof. Daehyung Park"
    bullets:
      - "Developed a long-horizon planning and replanning module for ForeSight (under review), reaching 70+% replanning success under action-execution disruptions vs. 50% for the strongest baseline."
      - "Implemented seven LLM-based planning and replanning baselines (e.g., ProgPrompt, Inner Monologue, DoReMi) in the AI2-THOR simulator."

