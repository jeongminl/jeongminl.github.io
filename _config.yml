# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the 
# server process.

# Basic Site Settings
locale                   : "en-US"
title                    : "Home"
title_separator          : "-"
name                     : &name "Jeongmin Lee"
description              : &description "Undergraduate Researcher | Computer Architecture & Systems"
url                      : "https://jeongminl.github.io" 
baseurl                  : "" 
repository               : "jeongminl/jeongminl.github.io"

# Site Author - shown in the sidebar on every page (_includes/author-profile.html).
#               Links whose field is blank are not shown.
author:
  # Biographic information
  avatar           : "profile.jpg"
  name             : "Jeongmin Lee"
  description      : "Undergraduate Researcher | KAIST & SNU ARC Lab"
  email            : "jeongminl@kaist.ac.kr"
  github           : "jeongminl"
  linkedin         : "jeongmin-lee-667353244"
  googlescholar    :
  orcid            :

# SEO Related
google_site_verification :
bing_site_verification   :

# Social Sharing
twitter:
  username               :
og_image                 :
og_description           :

# Analytics
# To enable Google Analytics, set provider to "google-analytics-4" and fill in tracking_id.
analytics:
  provider               : false
  google:
    tracking_id          :

# Reading Files
include:
  - _pages
exclude:
  - .github
  - .jekyll-cache
  - .sass-cache
  - docker-compose.yaml
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - _config_docker.yml
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Every page uses the single layout, which renders inside the default
# layout (masthead, author sidebar, footer).
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC 

# Plugins (all supported by GitHub Pages)
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

# Mimic GitHub Pages with --safe
whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
